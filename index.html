<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>라이프밀 인수인계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
window.HANDOVER_FIREBASE={
  /* MD 프로모션 보드와 같은 Firebase 프로젝트, 경로만 /handover 로 분리 */
  config:{
    apiKey:"AIzaSyBZ-swu89Xdfr4tmzcpQrE6pnbIyKdQBsQ",
    authDomain:"lifemeal-md-board.firebaseapp.com",
    databaseURL:"https://lifemeal-md-board-default-rtdb.asia-southeast1.firebasedatabase.app",

  },
  root:"handover"   /* 주소 뒤에 ?test 를 붙이면 handover_test 경로 사용 */

<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--ink:#131A26;--ink-2:#3A4254;--muted:#6B7386;
  --line:#E0E4EB;--line-soft:#ECEEF2;--navy:#1F3157;--navy-hover:#16244A;--on-navy:#FFFFFF;--navy-soft:#E9EDF5;
  --warn:#8F5A00;--warn-soft:#FBF0DC;--ok:#1E6A45;--ok-soft:#E2F1E8;--check:#34508F;--check-soft:#E6EBF7;
  --danger:#A33434;--danger-soft:#F7E4E4;--focus:#4A67A8;--scrim:rgba(19,26,38,.38);
  --sans:"Pretendard","Pretendard Variable","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0D121A;--surface:#141B26;--ink:#E3E7EE;--ink-2:#C2C8D3;--muted:#8B94A7;
  --line:#253044;--line-soft:#1B2331;--navy:#A7BCE6;--navy-hover:#C1D1F2;--on-navy:#0D121A;--navy-soft:#1B2640;
  --warn:#E7B566;--warn-soft:#2C2210;--ok:#82CFA6;--ok-soft:#10281D;--check:#AFC1EA;--check-soft:#1A2440;
  --danger:#F09090;--danger-soft:#321717;--focus:#A7BCE6;--scrim:rgba(0,0,0,.55);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D121A;--surface:#141B26;--ink:#E3E7EE;--ink-2:#C2C8D3;--muted:#8B94A7;
  --line:#253044;--line-soft:#1B2331;--navy:#A7BCE6;--navy-hover:#C1D1F2;--on-navy:#0D121A;--navy-soft:#1B2640;
  --warn:#E7B566;--warn-soft:#2C2210;--ok:#82CFA6;--ok-soft:#10281D;--check:#AFC1EA;--check-soft:#1A2440;
  --danger:#F09090;--danger-soft:#321717;--focus:#A7BCE6;--scrim:rgba(0,0,0,.55);}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:0}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding-inline:24px;height:56px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:600;letter-spacing:.16em;font-size:12.5px;color:var(--navy)}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.state{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.state i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.state.dirty{color:var(--warn)} .state.dirty i{background:var(--warn)}
.state.saved i{background:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{background:var(--navy-hover);border-color:var(--navy-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}

/* shell */
.shell{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:32px 80px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);align-self:start;display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.nav button{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--navy-soft);color:var(--navy);font-weight:500}
.nav .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav button.on .no{color:var(--navy)}
.nav .tag{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.nav-sep{height:1px;background:var(--line);margin:8px 10px}

main{min-width:0}

/* home */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.hero h1{font-size:34px;line-height:1.2;font-weight:300;letter-spacing:-.01em;margin-top:6px}
.hero .sub{color:var(--muted);margin-top:8px;font-size:13.5px}
.hero-r{margin-left:auto;display:flex;gap:8px}

.handover{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.inp{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;width:100%;min-width:0}
.inp:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--navy-soft)}
textarea.inp{height:auto;padding:10px 12px;line-height:1.55;resize:vertical}

.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;margin-top:32px}
.fact{border-top:2px solid var(--navy);padding-top:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .l{font-size:12px;color:var(--muted)}
.fact .v{font-size:26px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.fact .n{font-size:12.5px;color:var(--ink-2)}

.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;margin-top:40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.panel-h h2{font-size:15px;font-weight:600}
.panel-h .c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel-h .r{margin-left:auto}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:20px 72px minmax(0,1fr) 28px;align-items:start;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:16px;height:16px;margin:3px 0 0;accent-color:var(--navy);cursor:pointer}
.task .area{font-size:11.5px;color:var(--navy);background:var(--navy-soft);border-radius:5px;padding:1px 7px;justify-self:start;margin-top:2px;white-space:nowrap}
.task .t{font-size:13.5px;color:var(--ink)}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .x{border:0;background:none;color:var(--muted);cursor:pointer;height:24px;border-radius:6px;font-size:15px;line-height:1}
.task .x:hover{color:var(--danger);background:var(--danger-soft)}
.task-add{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;margin-top:12px}
.task-add .inp{height:34px;font-size:13px}

.links{list-style:none;margin:0;padding:0}
.links li{border-top:1px solid var(--line-soft)}
.links li:first-child{border-top:0}
.links a{display:flex;flex-direction:column;padding:8px 0;gap:1px}
.links a b{font-weight:500;font-size:13.5px;color:var(--ink)}
.links a span{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a:hover b{color:var(--navy)}

.toc-h{display:flex;align-items:baseline;gap:12px;margin-top:48px;margin-bottom:14px}
.toc-h h2{font-size:15px;font-weight:600}
.toc-h p{color:var(--muted);font-size:12.5px}
.toc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--navy)}
.card .top{display:flex;align-items:center;gap:8px}
.card .no{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.card .lock{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--navy-soft);color:var(--navy)}
.card h3{font-size:17px;font-weight:500;letter-spacing:-.005em}
.card p{font-size:12.8px;color:var(--ink-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;padding-top:6px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card.part1{grid-column:span 1;background:var(--navy);border-color:var(--navy)}
.card.part1 .no,.card.part1 h3,.card.part1 p,.card.part1 .meta{color:var(--on-navy)}
.card.part1 p,.card.part1 .meta{opacity:.82}
.card.part1 .lock{background:rgba(255,255,255,.16);color:var(--on-navy)}
:root[data-theme="dark"] .card.part1 .lock{background:rgba(13,18,26,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card.part1 .lock{background:rgba(13,18,26,.18)}}

/* section page */
.sec-head{padding-bottom:22px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end}
.sec-head h1{font-size:30px;font-weight:300;letter-spacing:-.01em;margin-top:6px;line-height:1.25}
.sec-head .lede{margin-top:10px;color:var(--ink-2);font-size:14.5px;max-width:62ch}
.sec-head .r{margin-left:auto;display:flex;gap:8px}
.groups{display:flex;flex-direction:column;gap:0;max-width:780px}
.group{padding:24px 0;border-bottom:1px solid var(--line-soft)}
.group h3{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:10px;letter-spacing:.005em}
.group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.group li{position:relative;padding-left:18px;font-size:14px;color:var(--ink);line-height:1.65}
.group li::before{content:"";position:absolute;left:2px;top:.8em;width:8px;height:1px;background:var(--navy)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
code.k{font-family:var(--mono);font-size:12.5px;background:var(--line-soft);border-radius:4px;padding:0 4px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:32px;max-width:780px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pager button:hover{border-color:var(--navy)}
.pager button.next{text-align:right}
.pager small{color:var(--muted);font-size:11.5px}
.pager span{font-weight:500}

/* edit forms */
.editor{display:flex;flex-direction:column;gap:14px;max-width:780px;margin-top:20px}
.edit-group{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.edit-group .row{display:flex;gap:8px;align-items:center}
.edit-group .row .inp{flex:1}
.hint{font-size:12px;color:var(--muted)}

/* accounts */
.acc-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.search{flex:1 1 240px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.acc-list{margin-top:18px;display:flex;flex-direction:column;gap:22px}
.cat-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;border-bottom:1px solid var(--line)}
.cat-h h3{font-size:13.5px;font-weight:600}
.cat-h span{font-size:12px;color:var(--muted)}
.acc-head,.acc-row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1.1fr) minmax(0,1.25fr) minmax(0,.9fr) 84px 96px;gap:12px;align-items:center}
.acc-head{font-size:11.5px;color:var(--muted);padding:10px 12px 6px}
.acc-row{padding:11px 12px;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.acc-row:first-of-type{border-top-left-radius:0}
.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows .acc-row:last-child{border-bottom:0}
.nm b{font-weight:500;display:block}
.nm a,.nm .u{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm a:hover{color:var(--navy)}
.cred{display:flex;align-items:center;gap:6px;min-width:0}
.cred .v{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cred .v.mask{letter-spacing:.12em;color:var(--ink-2)}
.cred .empty{font-size:12px;color:var(--muted)}
.cred .empty.need{color:var(--warn)}
.ic{flex:none;height:24px;padding:0 7px;border-radius:6px;border:1px solid var(--line);background:transparent;font-size:11px;color:var(--ink-2);cursor:pointer}
.ic:hover{border-color:var(--navy);color:var(--navy)}
.mfa{font-size:12.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;white-space:nowrap}
.st-todo{background:var(--warn-soft);color:var(--warn)}
.st-check{background:var(--check-soft);color:var(--check)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.detail{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:-2px}
.detail b{font-weight:500;color:var(--ink-2)}
.lbl{display:none}

.lockbox{max-width:460px;margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.lockbox h2{font-size:19px;font-weight:500}
.lockbox p{color:var(--ink-2);font-size:13.5px}
.lockbox .fine{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:12px}
.err{color:var(--danger);font-size:12.5px;min-height:1em}
.note{margin-top:28px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;max-width:780px}
.note b{color:var(--ink);font-weight:600}
.ro{margin-top:14px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:17px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
.pwrow{display:flex;gap:6px}
.pwrow .inp{flex:1;font-family:var(--mono)}
.sheet-f{display:flex;gap:8px;align-items:center;padding-top:6px}
.sheet-f .sp{flex:1}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1020px){
  .toc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .bar-in{padding-inline:16px}
  .shell{grid-template-columns:1fr;gap:20px;padding-inline:16px;padding-block:16px 64px}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-h,.nav-sep{display:none}
  .nav button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
  .nav button.on{border-color:var(--navy)}
  .nav .tag{display:none}
  .split{grid-template-columns:1fr}
  .hero h1{font-size:28px}
}
@media (max-width:760px){
  .brand span{display:none}
  .handover{grid-template-columns:1fr}
  .toc{grid-template-columns:1fr}
  .acc-head{display:none}
  .acc-row{grid-template-columns:1fr 1fr;gap:8px 12px}
  .acc-row .nm{grid-column:1/-1}
  .acc-row .cell-mfa{grid-column:1/-1}
  .acc-row .cell-st{grid-column:1}
  .acc-row .cell-ed{grid-column:2;justify-self:end}
  .lbl{display:block;font-size:11px;color:var(--muted)}
  .cell{display:flex;flex-direction:column;gap:2px;min-width:0}
  .grid2{grid-template-columns:1fr}
  .task{grid-template-columns:20px minmax(0,1fr) 28px}
  .task .area{grid-column:2}
  .task .t{grid-column:2}
  .task .x{grid-column:3;grid-row:1}
  .task-add{grid-template-columns:1fr}
}
@media (max-width:420px){.facts{grid-template-columns:1fr}.state span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* additions for the GitHub Pages version */
body{font-family:var(--sans)}
.state.live i{background:var(--ok)}
.state.off{color:var(--danger)} .state.off i{background:var(--danger)}
.state.busy i{background:var(--warn)}
.env-test{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:2px 7px}

.gate{min-height:calc(100vh - 57px);display:flex;align-items:flex-start;justify-content:center;padding-inline:16px;padding-block:9vh 48px}
.gate .lockbox{margin-top:0;width:100%;max-width:440px}
.gate .eyebrow{margin-bottom:-6px}
.gate h1{font-size:26px;font-weight:300;letter-spacing:-.01em}
.filebox{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.filebox input{font-size:12.5px}
.linkbtn{border:0;background:none;color:var(--navy);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

.gdesc{font-size:13.5px;color:var(--ink-2);margin:-2px 0 10px;max-width:68ch}
.group ol.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.group ol.steps>li{counter-increment:st;position:relative;padding-left:30px;font-size:14px;line-height:1.65}
.group ol.steps>li::before{content:counter(st);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.group ul.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.group ul.bul>li{position:relative;padding-left:18px;font-size:14px;line-height:1.65}
.group ul.bul>li::before{content:"";position:absolute;left:2px;top:.8em;width:8px;height:1px;background:var(--navy)}
.group ul.sub{list-style:none;margin:5px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.group ul.sub li{position:relative;padding-left:14px;font-size:13.2px;color:var(--ink-2);line-height:1.6}
.group ul.sub li::before{content:"";position:absolute;left:2px;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.group li::before{}
.callout{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13.2px;line-height:1.6}
.callout+.callout{margin-top:-4px}
.group > *:first-child{margin-top:0}
.group ol.steps+ul.bul,.group ul.bul+ol.steps,.group .callout+ol,.group .callout+ul{margin-top:10px}

.bill{margin-top:24px}
.bill-sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px;font-variant-numeric:tabular-nums}
.bill-sum b{color:var(--ink);font-weight:600}
.bill-sum .warn{color:var(--warn)}
.bill-list{list-style:none;margin:0;padding:0}
.bill-list li{display:grid;grid-template-columns:52px 58px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13.5px;cursor:pointer}
.bill-list li:first-child{border-top:0}
.bill-list li:hover .bn{color:var(--navy)}
.bill-list .bd{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}
.bill-list .bn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-list .bn small{color:var(--muted);font-size:11.5px;margin-left:6px}
.bill-list .ba{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dday{display:inline-flex;justify-content:center;height:21px;padding:0 7px;border-radius:999px;font-size:11px;background:var(--line-soft);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dday.soon{background:var(--warn-soft);color:var(--warn)}
.dday.none{background:transparent;color:var(--muted)}
.howbox{grid-column:1/-1;background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;margin-top:2px}
.howbox ol.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:6px}
.howbox ol.steps>li{counter-increment:st;position:relative;padding-left:28px;font-size:13px;line-height:1.6}
.howbox ol.steps>li::before{content:counter(st);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.howbox ul.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.howbox ul.bul>li{position:relative;padding-left:16px;font-size:13px;line-height:1.6}
.howbox ul.bul>li::before{content:"";position:absolute;left:2px;top:.8em;width:7px;height:1px;background:var(--navy)}
.howbox ul.sub{list-style:none;margin:4px 0 0;padding:0}
.howbox ul.sub li{font-size:12.5px;color:var(--ink-2);padding-left:12px}
.howbox .callout{margin:8px 0 0;font-size:12.5px}
.ic.on{border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}
.subh{font-size:12px;font-weight:600;color:var(--navy);letter-spacing:.02em;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:2px}
.stale{margin-top:14px;font-size:12.5px;color:var(--check);background:var(--check-soft);border-radius:8px;padding:8px 12px;max-width:780px}
.sec-tools{display:flex;gap:6px;flex-wrap:wrap}
.danger-zone{border-top:1px solid var(--line-soft);padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}


/* ===== simple layout ===== */
:root{--g-bg:#E8F0FE;--g-ink:#1A56C7;--n-bg:#E6F6EC;--n-ink:#127A3E;--k-bg:#FFF6CC;--k-ink:#7A5D00}
@media (prefers-color-scheme:dark){:root{--g-bg:#1B2A45;--g-ink:#9CC0FF;--n-bg:#12291C;--n-ink:#7BD6A2;--k-bg:#2E2810;--k-ink:#F0D36A}}
.ssobox{display:flex;align-items:center;gap:6px;padding:4px 2px;min-width:0}
.sso-chip{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.sso-google{background:var(--g-bg);color:var(--g-ink)}
.sso-naver{background:var(--n-bg);color:var(--n-ink)}
.sso-kakao{background:var(--k-bg);color:var(--k-ink)}
.sso-id{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.idbox{display:flex;align-items:center;gap:3px}
.idbox .cell{flex:1}
.mini.g{font-weight:700;color:var(--g-ink);border-color:var(--line)}
.mini.g:hover{background:var(--g-bg);border-color:var(--g-ink)}
.acat{margin-top:26px}
.acat-h{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:10px}
.acat-h span{font-size:12px;color:var(--muted);font-weight:400}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.acard.is-open{border-color:var(--navy)}
.ac-top{display:flex;align-items:center;gap:8px;min-width:0}
.ac-top h3{font-size:15.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-link{margin-left:auto;font-size:12px;flex:none}
.ac-grid{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;align-items:center}
.ac-l{font-size:12px;color:var(--muted)}
.ac-top-l{align-self:start;padding-top:7px}
.cell.memo{resize:vertical;min-height:52px;line-height:1.5;font-family:inherit}
.ac-v{min-width:0}
.ac-v .cell.box{padding:6px 8px}
.paybox{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.paybox .daycell{width:52px;flex:none}
.paybox .amtcell{width:110px;flex:none}
.ac-foot{display:flex;gap:6px;border-top:1px solid var(--line-soft);padding-top:10px}
.ac-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.ac-btn:hover,.ac-btn.on{border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}
.ac-sec{border-top:1px solid var(--line-soft);padding-top:10px}
.acard .exp-fields{grid-template-columns:1fr 1fr}
.pw-sso{font-size:12px;color:var(--muted);padding:0 8px}
.count .gcount{color:var(--g-ink)}
.bar-in{max-width:1180px;gap:18px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface)}
.tab.on{background:var(--navy);color:var(--on-navy);font-weight:500}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:28px 64px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:14px}
.top-r{margin-left:auto;display:flex;gap:8px}
.ttl{font-size:26px;font-weight:300;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.count{font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.count .warn,.sum.warn b{color:var(--warn)}
.search{width:240px;max-width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--navy);width:16px;height:16px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:860px;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0}
.tbl td{padding:3px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr.cat td{background:var(--bg);font-size:12px;font-weight:600;color:var(--navy);padding:8px 12px;letter-spacing:.02em}
.tbl tr.row:hover td{background:color-mix(in srgb,var(--navy-soft) 35%,transparent)}
.tbl tr.is-open td{background:var(--navy-soft)}
.c-svc{width:22%}.c-id{width:18%}.c-pw{width:21%}.c-day{width:10%}.c-amt{width:10%}.c-memo{width:19%}
.svc{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:8px 6px;text-align:left;width:100%;font-size:13.5px;color:var(--ink)}
.svc .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc:hover .nm{color:var(--navy)}
.chev{flex:none;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.is-open .chev{transform:rotate(45deg);border-color:var(--navy)}
.cell{width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 8px;font-size:13.5px;color:var(--ink)}
.cell:hover{border-color:var(--line)}
.cell:focus{outline:none;border-color:var(--navy);background:var(--surface);box-shadow:0 0 0 3px var(--navy-soft)}
.cell::placeholder{color:var(--muted);opacity:.7}
.cell.mono{font-family:var(--mono);font-size:12.5px}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
.cell.box{border-color:var(--line);background:var(--surface)}
select.cell{appearance:auto}
.pwbox{display:flex;align-items:center;gap:3px}
.pwbox .cell{flex:1}
.mini{flex:none;height:24px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--ink-2);cursor:pointer}
.mini:hover{border-color:var(--navy);color:var(--navy)}
.daybox{display:flex;align-items:center;gap:2px}
.daybox .cell{width:48px;flex:none}
.unit,.yr{font-size:12px;color:var(--muted)}
.dd{display:inline-block;margin-left:4px;font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--line-soft);color:var(--ink-2);white-space:nowrap}
.c-day{white-space:nowrap}
.c-day .dd{margin-left:8px}
.dd.soon{background:var(--warn-soft);color:var(--warn)}
.dd.none{background:transparent;color:var(--muted)}
.empty-row{padding:20px!important;color:var(--muted);text-align:center}
.add{margin-top:12px}

/* expanded row */
.tbl tr.exp td{background:var(--surface);padding:0;border-bottom:1px solid var(--line)}
.exp-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;padding:16px 18px 18px 36px}
.exp-h{display:flex;align-items:center;gap:14px;margin-bottom:8px;font-size:13px}
.exp-h b{font-weight:600;color:var(--navy)}
.exp-h .linkbtn:last-child{margin-left:auto}
.exp-how textarea{width:100%}
.exp-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-content:start}
.exp-fields .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.exp-fields label{font-size:11.5px;color:var(--muted)}
.exp-fields .f-del{grid-column:1/-1;align-items:flex-start;margin-top:4px}
.howbox{background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px}
.howbox ol.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:6px}
.howbox ol.steps>li{counter-increment:st;position:relative;padding-left:28px;font-size:13px;line-height:1.6}
.howbox ol.steps>li::before{content:counter(st);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.howbox ul.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.howbox ul.bul>li{position:relative;padding-left:16px;font-size:13px;line-height:1.6}
.howbox ul.bul>li::before{content:"";position:absolute;left:2px;top:.8em;width:7px;height:1px;background:var(--navy)}
.howbox ul.sub{list-style:none;margin:4px 0 0;padding:0}
.howbox ul.sub li{font-size:12.5px;color:var(--ink-2);padding-left:12px}
.howbox .callout{margin:8px 0 0;font-size:12.5px}

/* payments */
.sumrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:150px}
.sum span{font-size:12px;color:var(--muted)}
.sum b{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.paytbl{min-width:720px}
.paytbl td{padding:10px 10px}
.paytbl .r{text-align:right}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.linkbtn.strong{font-weight:500;text-decoration:none;color:var(--ink)}
.linkbtn.strong:hover{color:var(--navy);text-decoration:underline}
.linkbtn.back{margin-bottom:16px;text-decoration:none}

/* tools */
.tools{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tools .linkbtn{color:var(--muted);font-size:12.5px}
.tools-in{display:flex;flex-wrap:wrap;gap:8px}
.lockbox.inline{margin-top:0}
.toc .top-c{display:flex}
.handover{margin-top:6px}

@media (max-width:860px){
  .wrap{padding-inline:16px;padding-block:18px 56px}
  .bar-in{padding-inline:12px;gap:10px}
  .brand span{display:none}
  .tab{padding:7px 9px;font-size:13px}
  .state span{display:none}
  .exp-in{grid-template-columns:1fr;padding:14px}
  .exp-fields{grid-template-columns:1fr}
}

/* ===== site layout v3: sidebar + home ===== */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.app.locked{grid-template-columns:minmax(0,1fr)}
.app.locked .side,.app.locked .side-scrim,.app.locked .menu-btn{display:none!important}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 12px 14px;scrollbar-width:thin}
.side-brand{display:flex;flex-direction:column;gap:2px;padding:2px 10px 16px;text-decoration:none!important}
.side-brand .eyebrow{font-size:10.5px;letter-spacing:.2em;color:var(--navy);font-weight:600}
.side-brand b{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.side-brand .env-test{align-self:flex-start;margin-top:4px}
.menu{display:flex;flex-direction:column;gap:1px;flex:1}
.menu-h{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:18px 10px 6px;font-weight:500}
.menu-sub{font-size:11.5px;color:var(--ink-2);padding:10px 10px 3px;font-weight:600}
.mi{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink-2);font-size:13.5px;text-decoration:none!important;min-width:0}
.mi:hover{background:var(--bg);color:var(--ink)}
.mi.on{background:var(--navy-soft);color:var(--navy);font-weight:600}
.mi .svg{flex:none;opacity:.85}
.mi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.mi.doc{padding:5px 10px 5px 14px;font-size:13px}
.mi.doc::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--line);flex:none;margin-right:2px}
.mi.doc.on::before{background:var(--navy)}
.menu-add{margin:10px 10px 0;border:1px dashed var(--line);background:none;border-radius:7px;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;text-align:left}
.menu-add:hover{border-color:var(--navy);color:var(--navy)}
.side-foot{border-top:1px solid var(--line-soft);margin-top:16px;padding:12px 4px 0 10px;display:flex;align-items:center;gap:2px}
.side-foot .sp{flex:1}
.side-foot .lk{display:inline-flex;align-items:center;gap:5px;border:0;background:none;font-size:12.5px;color:var(--muted);cursor:pointer;padding:5px 7px;border-radius:6px;text-decoration:none!important}
.side-foot .lk:hover,.side-foot .lk.on{color:var(--navy);background:var(--navy-soft)}
.side-foot .lk .svg{width:14px;height:14px}
.side-scrim{display:none}
.col{min-width:0;display:flex;flex-direction:column}
.mbar{display:none}
.page{width:100%;max-width:1160px;margin:0 auto;padding:36px 40px 80px}
.app.locked .page{max-width:none;padding:0}
body.noscroll{overflow:hidden}
.svg{display:inline-block;vertical-align:middle}

/* home */
.hero{padding-bottom:22px}
.hero h1{font-size:32px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:var(--ink);text-decoration:none!important;cursor:pointer;text-align:left;min-width:0;font:inherit}
.tile:hover{border-color:var(--navy)}
.tile .l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tile .v{font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.tile .v small{font-size:14px;margin-left:2px;color:var(--ink-2)}
.tile .s{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px;min-width:0}
.tile .s span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tile .s .g{color:var(--g-ink)}.tile .s .w{color:var(--warn)}
.blk{margin-top:44px}
.blk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.blk-h h2{font-size:17px;font-weight:600}
.blk-h .c{font-size:12.5px;color:var(--muted)}
.blk-h .r{margin-left:auto;align-self:center}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sc{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-decoration:none!important;color:var(--ink);min-width:0}
a.sc:hover{border-color:var(--navy)}
a.sc:hover .sc-x{color:var(--navy)}
.sc.off{opacity:.6}
.sc-t{display:flex;flex-direction:column;min-width:0;flex:1}
.sc-t b{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-t small{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-x{flex:none;color:var(--muted);width:14px;height:14px}
.ico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.ico.g{background:var(--g-bg);color:var(--g-ink)}
.ico.lg{width:48px;height:48px;border-radius:12px;font-size:19px}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:44px}
.panel-h .more{font-size:12.5px;margin-left:auto}
.hl{list-style:none;margin:0;padding:0}
.hl li{display:grid;grid-template-columns:18px auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.hl li:first-child{border-top:0}
.hl input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--navy);cursor:pointer}
.hl .area{font-size:11.5px;color:var(--navy);background:var(--navy-soft);border-radius:5px;padding:1px 7px;white-space:nowrap;margin-top:1px}
.hl.pay li{grid-template-columns:44px auto minmax(0,1fr) auto;align-items:center}
.hl.pay .dd{margin-left:0}
.hl .t{min-width:0}
.hl.pay .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .a{color:var(--ink-2)}
.hl li.clk{cursor:pointer}
.hl li.clk:hover .t{color:var(--navy)}
.dgroup{margin-top:18px}
.dgroup:first-of-type{margin-top:0}
.dg-h{font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:10px;letter-spacing:.02em}
a.card{color:var(--ink);text-decoration:none!important}
a.card h3{font-size:16px}

/* accounts */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:8px 0 12px}
.seg{display:inline-flex;background:var(--line-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--ink-2);cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(19,26,38,.1)}
.seg button.on.g{color:var(--g-ink)}
.warn-t{font-size:12.5px;color:var(--warn)}
.chip span{color:var(--muted);margin-left:2px}
.chip.on span{color:inherit;opacity:.75}
.chips.static .chip{cursor:default;display:inline-flex;align-items:center}
.top-r{align-items:center}
.top-r .search{width:260px;flex:0 1 260px}
.acat{margin-top:30px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:stretch}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;transition:box-shadow .15s,border-color .15s}
.slot:hover{box-shadow:0 6px 20px rgba(19,26,38,.07);border-color:color-mix(in srgb,var(--navy) 28%,var(--line))}
.slot-h{display:flex;gap:12px;align-items:center;padding:16px 16px 10px;min-width:0}
.slot-t{min-width:0;display:flex;flex-direction:column;flex:1}
.slot-t h3{font-size:15px;font-weight:600;line-height:1.35;min-width:0}
.tbtn{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tbtn:hover{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.slot-u{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.slot-u:hover{color:var(--navy)}
.slot-u.none{font-family:var(--sans)}
.gbadge{flex:none;width:22px;height:22px;border-radius:6px;background:var(--g-bg);color:var(--g-ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:flex-start}
.props{display:flex;flex-direction:column;gap:2px;padding:0 16px 12px}
.prop{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px;align-items:center;min-height:34px}
.prop.top{align-items:start}
.prop.top .pl{padding-top:3px}
.pl{font-size:12px;color:var(--muted)}
.pv{min-width:0}
.props .cell.box{border-color:transparent;background:transparent;padding:5px 8px;font-size:13px}
.props .cell.box:hover{border-color:var(--line);background:var(--surface)}
.props .cell.box:focus{border-color:var(--navy);background:var(--surface)}
.props .cell[data-f="pw"]:placeholder-shown::placeholder{color:var(--warn);opacity:.9}
.ro-v{display:flex;align-items:center;gap:6px;padding:0 0 0 8px;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pw-sso{font-size:12.5px;color:var(--muted);padding:0 8px}
.note-v{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:2px 8px 0;line-height:1.5}
.lseg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:8px;max-width:calc(100% - 8px)}
.lseg button{border:0;background:var(--surface);padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.lseg button+button{border-left:1px solid var(--line)}
.lseg button:hover{color:var(--ink)}
.lseg button.on{background:var(--navy-soft);color:var(--navy);font-weight:600}
.lseg button.on.g{background:var(--g-bg);color:var(--g-ink)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--line-soft);color:var(--ink-2)}
.pv>.tag{margin-left:8px}
.slot-f{display:flex;align-items:center;gap:6px;padding:12px 16px;border-top:1px solid var(--line-soft);margin-top:auto}
.slot-f .sp{flex:1}
.btn.go{gap:5px}
.btn.go .svg{width:13px;height:13px}

/* peek panel */
.peek-scrim{position:fixed;inset:0;background:var(--scrim);z-index:45}
.peek{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:46;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.16);display:flex;flex-direction:column}
.peek-top{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:8px;padding:10px 14px 10px 24px;border-bottom:1px solid var(--line-soft);z-index:1}
.crumb{font-size:12px;color:var(--muted)}
.x-btn{margin-left:auto;width:34px;height:34px;border:0;background:none;border-radius:8px;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.x-btn:hover{background:var(--bg);color:var(--ink)}
.peek-h{display:flex;gap:14px;align-items:center;padding:22px 24px 6px}
.ph-t{min-width:0;flex:1;display:flex;flex-direction:column}
.peek-h h2{font-size:22px;font-weight:600;line-height:1.3}
.peek-h .u{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek-b{padding:6px 24px 36px;display:flex;flex-direction:column}
.pk{padding:18px 0;border-top:1px solid var(--line-soft)}
.pk:first-child{border-top:0}
.pk>h3{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:10px}
.pk .props{padding:0}
.pk .exp-h{margin-bottom:10px}
.pk .howbox{margin-top:0}
.pk .exp-fields{grid-template-columns:1fr 1fr}
.pk .memo{width:100%}
.suffix{display:flex;align-items:center;gap:6px}
.suffix .cell{flex:1}
.pay-now{font-size:13px;color:var(--ink-2);min-height:34px;display:flex;align-items:center;gap:6px}
.pk-del{padding-top:14px;border-top:1px solid var(--line-soft)}

/* document page */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--navy)}
.pager a{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;color:var(--ink);text-decoration:none!important}
.pager a:hover{border-color:var(--navy)}
.pager a.next{text-align:right}

/* settings */
.set-grid{display:flex;flex-direction:column;gap:16px;max-width:880px}
.mg-row{display:grid;grid-template-columns:28px minmax(0,1fr) 190px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.mg-row:first-child{border-top:0}
.mg-row .no{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mg-t{color:var(--ink);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-row .inp{height:32px;font-size:13px}
.mg-btns{display:flex;gap:4px}
.mini:disabled{opacity:.35;cursor:default}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.stale{margin-top:24px}

@media (max-width:1100px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding:28px 28px 72px}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;max-width:86vw;z-index:40;transform:translateX(-102%);transition:transform .2s ease;height:auto}
  .app.nav-open .side{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.18)}
  .app.nav-open .side-scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:39}
  .mbar{display:flex;position:sticky;top:0;z-index:20;height:54px;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line)}
  .mbrand{display:flex;align-items:baseline;gap:8px;color:var(--ink);text-decoration:none!important}
  .mbrand b{font-size:12.5px;letter-spacing:.16em;color:var(--navy);font-weight:600}
  .mbrand span{font-size:14px;font-weight:500}
  .mbar .state{margin-left:auto}
  .mbar .state span{display:none}
  .menu-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
  .menu-btn i{display:block;width:16px;height:1.5px;background:var(--ink);border-radius:1px}
  .app.locked .mbar{display:none}
  .page{padding:20px 16px 64px}
  .split2{grid-template-columns:1fr}
  .top-r{margin-left:0;width:100%}
  .top-r .search{flex:1 1 auto;width:auto}
}
@media (max-width:600px){
  .hero h1{font-size:26px}
  .tiles{gap:8px}
  .tile{padding:14px}
  .tile .v{font-size:24px}
  .acards{grid-template-columns:minmax(0,1fr)}
  .pk .exp-fields{grid-template-columns:1fr}
  .peek-h{padding:18px 16px 6px}
  .peek-b{padding:6px 16px 32px}
  .peek-top{padding-left:16px}
  .mg-row{grid-template-columns:24px minmax(0,1fr) auto}
  .mg-row .inp{grid-column:2/-1;grid-row:2}
  .shortcuts{grid-template-columns:minmax(0,1fr)}
}

/* ===== category colors + save ===== */
.cc0{--cc-bg:#E8EFFC;--cc-ink:#2F5AA8}.cc1{--cc-bg:#E0F3F0;--cc-ink:#1D7468}.cc2{--cc-bg:#FCEFE1;--cc-ink:#A2560F}.cc3{--cc-bg:#FBE8F0;--cc-ink:#A23A66}.cc4{--cc-bg:#EFE9FB;--cc-ink:#6743AD}.cc5{--cc-bg:#E2F1F9;--cc-ink:#1C6890}.cc6{--cc-bg:#E7F3E3;--cc-ink:#3B772C}.cc7{--cc-bg:#ECEEF2;--cc-ink:#566072}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cc0{--cc-bg:#1A2742;--cc-ink:#9DBBF0}:root:not([data-theme="light"]) .cc1{--cc-bg:#123029;--cc-ink:#7FD1C4}:root:not([data-theme="light"]) .cc2{--cc-bg:#35240F;--cc-ink:#F0B879}:root:not([data-theme="light"]) .cc3{--cc-bg:#361A27;--cc-ink:#EFA0C0}:root:not([data-theme="light"]) .cc4{--cc-bg:#281E42;--cc-ink:#C3AEF2}:root:not([data-theme="light"]) .cc5{--cc-bg:#12293A;--cc-ink:#8CC8EA}:root:not([data-theme="light"]) .cc6{--cc-bg:#1A2E16;--cc-ink:#A6D896}:root:not([data-theme="light"]) .cc7{--cc-bg:#1F2530;--cc-ink:#AEB6C4}}
:root[data-theme="dark"] .cc0{--cc-bg:#1A2742;--cc-ink:#9DBBF0}:root[data-theme="dark"] .cc1{--cc-bg:#123029;--cc-ink:#7FD1C4}:root[data-theme="dark"] .cc2{--cc-bg:#35240F;--cc-ink:#F0B879}:root[data-theme="dark"] .cc3{--cc-bg:#361A27;--cc-ink:#EFA0C0}:root[data-theme="dark"] .cc4{--cc-bg:#281E42;--cc-ink:#C3AEF2}:root[data-theme="dark"] .cc5{--cc-bg:#12293A;--cc-ink:#8CC8EA}:root[data-theme="dark"] .cc6{--cc-bg:#1A2E16;--cc-ink:#A6D896}:root[data-theme="dark"] .cc7{--cc-bg:#1F2530;--cc-ink:#AEB6C4}
.cpill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:7px;background:var(--cc-bg,var(--line-soft));color:var(--cc-ink,var(--ink-2));font-size:14px;font-weight:600;white-space:nowrap}
.cpill.sm{height:22px;padding:0 8px;font-size:12px;margin-left:4px}
.acat{margin-top:36px}
.acat-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--cc-bg,var(--line))}
.acat-h .n{font-size:12.5px;color:var(--muted);font-weight:400}
.acat-h .cpill{font-size:14px;font-weight:600;color:var(--cc-ink)}
.slot{border-top:3px solid var(--cc-ink,var(--line))}
.slot .ico,.peek .ico{background:var(--cc-bg);color:var(--cc-ink)}
.chip.cat::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc-ink);margin-right:6px;vertical-align:1px}
.chip.cat.on{background:var(--cc-ink);border-color:var(--cc-ink);color:var(--surface)}
.chip.cat.on::before{background:var(--surface)}
.btn.save{display:none}
.slot.dirty .btn.save{display:inline-flex;background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.slot.dirty{box-shadow:0 0 0 2px color-mix(in srgb,var(--navy) 30%,transparent)}
.peek-f{position:sticky;bottom:0;margin-top:auto;background:var(--surface);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.peek-f .hint{flex:1;min-width:0}
.peek.dirty .peek-f .btn{box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 25%,transparent)}
.menu-sub{display:flex;align-items:center;gap:7px}
.menu-sub::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--cc-ink);flex:none}
.dg-h{display:flex;align-items:center;gap:8px;color:var(--cc-ink)}
.dg-h::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cc-ink)}
.dgroup a.card{border-top:3px solid var(--cc-ink)}
@media (max-width:600px){.peek-f{padding-inline:16px}.peek-f .hint{display:none}.peek-f .btn{flex:1}}

.mrow{display:flex;align-items:center;min-width:0;border-radius:7px}
.mrow .mi{flex:1;min-width:0}
.mrow .mi .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star-b{flex:none;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);opacity:0;padding:0}
.star-b svg{width:14px;height:14px}
.mrow:hover .star-b,.star-b:focus-visible{opacity:.55}
.star-b:hover{opacity:1!important;background:var(--bg)}
.star-b.on{opacity:1;color:var(--warn)}
@media (hover:none){.star-b{opacity:.35}.star-b.on{opacity:1}}
.menu-fav{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);padding:10px 10px 3px;font-weight:600}
.menu-fav svg{width:11px;height:11px}
.mi.fav{padding:5px 10px 5px 14px;font-size:13px}
.mi.fav::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--warn);flex:none;margin-right:2px;opacity:.7}
.star-t{display:inline-flex;align-items:center;gap:6px}
.star-t svg{width:15px;height:15px}
.btn.star-t.on{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.card .cstar{color:var(--warn);display:inline-flex;vertical-align:-2px;margin-right:5px}
.card .cstar svg{width:13px;height:13px}
.sec-head .r{display:flex;gap:8px;align-items:center}
.pin .pst{display:inline-flex;color:var(--warn);margin-right:6px;vertical-align:-2px}
.pin .pst svg{width:13px;height:13px}
.shot{margin:14px 0 10px;max-width:880px;container-type:inline-size}
.shot-in{position:relative;display:block;width:100%;border:1px solid var(--line);border-radius:10px;overflow:visible;background:var(--bg);cursor:zoom-in;outline-offset:3px}
.shot-in img{display:block;width:100%;height:100%;object-fit:cover;border-radius:9px}
.shot-in img:not([src]){visibility:hidden}
.shot.miss .shot-in::after{content:"사진을 불러오지 못했습니다";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.bx{position:absolute;border:2px solid #E0312E;border-radius:4px;pointer-events:none;box-sizing:border-box}
.bx.k-c{border:2px dashed #2446A6}
.bx.k-a{border:2px dashed #178A4C}
.bx i{position:absolute;left:-2px;bottom:100%;margin-bottom:3px;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;background:#E0312E;color:#fff;font:600 11.5px/20px var(--sans);font-style:normal;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.bx.k-c i{background:#2446A6}
.bx.k-a i{background:#178A4C}
.bx.in i{bottom:auto;top:4px;left:4px;margin:0}
.bx i b{font-weight:700}
.bx i em{font-style:normal;font-weight:600}
@container (max-width:620px){.bx i em{display:none}.bx i{height:18px;padding:0 5px;font-size:11px}}
.shot figcaption{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.55}
.bx-leg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.shot.tall{max-width:440px}
.lb .tall-in{max-width:min(760px,100%)}
.bx-leg li::before{content:none!important;display:none!important}
.bx-leg li{display:flex;gap:7px;align-items:baseline;color:var(--ink-2);font-size:12.5px}
.bx-leg li b{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:#E0312E;color:#fff;font-size:11px}
.bx-leg li.k-c b{background:#2446A6}
.bx-leg li.k-a b{background:#178A4C}
@container (min-width:621px){.bx-leg{display:none}}
.bx-key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.bx-key span::before{content:"";display:inline-block;width:14px;height:9px;margin-right:5px;vertical-align:-1px;border-radius:2px;border:2px solid #E0312E}
.bx-key .k-c::before{border:2px dashed #2446A6}
.bx-key .k-a::before{border:2px dashed #178A4C}
.lb{position:fixed;inset:0;z-index:90;background:rgba(10,14,22,.82);overflow:auto;padding:48px 16px 24px;cursor:zoom-out}
.lb .shot-in{max-width:min(1400px,100%);margin:0 auto;cursor:zoom-out;border-color:transparent}
.lb .bx i em{display:inline}
.lb-x{position:fixed;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.flow{display:flex;align-items:stretch;gap:8px;margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-width:880px;overflow-x:auto}
.flow .fs{flex:1 1 0;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 13px}
.flow .fs.last{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.flow .fs .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.flow .fs h4{margin:8px 0 5px;font-size:14px;line-height:1.35;color:var(--ink)}
.flow .fs h4 b{color:var(--danger);background:var(--danger-soft);border-radius:3px;padding:0 3px}
.flow .fs p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.flow .ar{flex:none;align-self:center;color:var(--muted);font-size:16px}
@media (max-width:640px){.flow{flex-direction:column}.flow .ar{transform:rotate(90deg)}.flow .fs{min-width:0}}
.codeb{margin:10px 0;max-width:880px;padding:11px 13px;border-radius:8px;background:#141A22;color:#D7DEE8;font:12.5px/1.65 var(--mono);white-space:pre-wrap;word-break:break-all;overflow-x:auto}
.codeb mark{background:#FFD84D;color:#141A22;border-radius:2px;padding:0 2px}
.devref{margin:8px 0;max-width:880px;padding:8px 11px;border-left:3px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
.devref>b{display:block;color:var(--ink-2);font-size:11.5px;margin-bottom:1px}
.devref code{font-family:var(--mono);font-size:11.5px}
.imgbar{display:flex;gap:8px;align-items:center;margin-top:6px}
.imgbar .hint{margin:0}
.dwg{margin:12px 0 8px;padding:14px 14px 10px;border:1px solid var(--line);border-radius:10px;background-color:var(--surface);background-image:linear-gradient(color-mix(in srgb,var(--navy) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--navy) 6%,transparent) 1px,transparent 1px);background-size:16px 16px;display:flex;flex-wrap:wrap;gap:16px 22px;align-items:flex-end;max-width:780px}
.dwg svg{display:block;max-width:100%;height:auto;overflow:visible}
.dwg .f{fill:var(--surface);stroke:var(--navy);stroke-width:1.4}
.dwg .x{stroke:color-mix(in srgb,var(--navy) 16%,transparent);stroke-width:1}
.dwg .dim{stroke:var(--muted);stroke-width:1;fill:none}
.dwg .dt{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.dwg .safe{fill:none;stroke:var(--ok);stroke-width:1.3;stroke-dasharray:4 3}
.dwg .hatch{fill:color-mix(in srgb,var(--warn) 18%,transparent);fill-rule:evenodd}
.dwg .z{fill:color-mix(in srgb,var(--navy) 11%,transparent);stroke:var(--navy);stroke-width:1;stroke-dasharray:3 2}
.dwg .zt{fill:var(--navy);font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.dwg .cut{stroke:var(--warn);stroke-width:1;stroke-dasharray:6 3}
.dwg .ct{fill:var(--warn);font-size:10px;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.dwg .nm{fill:var(--ink);font-size:12px;font-weight:600}
.dwg .rt{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.dwg-key{width:100%;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.dwg-key i{display:inline-block;width:14px;height:9px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.dwg-key .k1{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.dwg-key .k2{border:1.3px dashed var(--ok)}
.dwg-key .k3{background:color-mix(in srgb,var(--navy) 14%,transparent);border:1px dashed var(--navy)}
.dwg-key .k4{height:0;border-top:1.3px dashed var(--warn);vertical-align:3px}
.doc-toc{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px;max-width:780px}
.doc-toc button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.doc-toc button:hover{border-color:var(--navy);color:var(--navy)}
.group{scroll-margin-top:72px}
.jump{border:0;background:none;padding:0;color:var(--navy);cursor:pointer;font:inherit;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--navy) 35%,transparent)}
.dl.in::after{content:"\2192"}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pin{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--cc-ink);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.pin b{font-size:14px;font-weight:600}
.pin small{font-size:12px;color:var(--muted);line-height:1.5}
.pin,.pin:hover{text-decoration:none}
.pin:hover{border-color:var(--navy);border-left-color:var(--cc-ink)}
.pinchk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.dl{font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--navy) 35%,transparent);text-underline-offset:3px}
.dl::after{content:"\2197";font-size:.78em;margin-left:2px;opacity:.7}
.dl:hover{text-decoration-color:var(--navy)}

.slot.is-ext{border-top-style:dashed;background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.slot.is-ext .ico{filter:grayscale(1);opacity:.65}
.slot.is-ext .tbtn{color:var(--ink-2)}
.tag.ext{flex:none;align-self:flex-start;background:var(--line-soft);color:var(--ink-2);border:1px dashed var(--line)}
.props .cell.mgr:placeholder-shown{border-color:var(--line);background:var(--surface)}
.props .cell.mgr:placeholder-shown::placeholder{color:var(--warn);opacity:.9}
.ext-btn{color:var(--muted)}
@media (max-width:600px){.filters .seg{max-width:100%}}
</style>
</head>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* ================= config ================= */
var CFG=window.HANDOVER_FIREBASE||{};
var TEST=/[?&]test\b/.test(location.search);
var ROOT=(CFG.root||'handover')+(TEST?'_test':'');
var ITER=310000, ROOM_ITER=200000, IDLE_MIN=20;

/* ================= state ================= */
var S={
  phase:'lock',
  pass:null,key:null,salt:null,room:null,
  nodes:{},ivs:{},seq:0,
  tab:'home',view:'home',editing:null,homeEdit:false,armed:null,stale:false,
  conn:null,pending:0,err:'',busy:false,last:Date.now(),
  q:'',lf:'',cf:'',peek:null,doc:null,navOpen:false,pendingEdit:null,open:{},more:{},showPw:{},editHow:null,remember:true,toolsOpen:false,masterOpen:false,applying:false
};
var db=null,nodesRef=null,connRef=null,authReady=null;

/* ================= firebase ================= */
function initFirebase(){
  if(db)return true;
  try{
    if(!window.firebase||!CFG.config)return false;
    if(!firebase.apps.length)firebase.initializeApp(CFG.config);
    db=firebase.database();
    authReady=firebase.auth?firebase.auth().signInAnonymously().catch(function(e){console.warn('익명 로그인 실패',e)}):Promise.resolve();
    connRef=db.ref('.info/connected');
    connRef.on('value',function(s){S.conn=!!s.val();updateBar()});
    return true;
  }catch(e){console.error(e);return false}
}
function roomRef(p){return db.ref(ROOT+'/'+S.room+(p?'/'+p:''))}

/* ================= crypto ================= */
var te=new TextEncoder(),td=new TextDecoder();
function toB64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function fromB64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
function baseKey(pass){return crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey','deriveBits'])}
function roomIdOf(pass){
  return baseKey(pass).then(function(b){return crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode('lifemeal-handover/room/v1'),iterations:ROOM_ITER,hash:'SHA-256'},b,128)}).then(hex);
}
function aesKey(pass,salt,iter){
  return baseKey(pass).then(function(b){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter||ITER,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])});
}
function encWith(key,obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,te.encode(JSON.stringify(obj))).then(function(ct){return {iv:toB64(iv),ct:toB64(ct),at:Date.now()}});
}
function decWith(key,blob){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(blob.iv)},key,fromB64(blob.ct)).then(function(pt){return JSON.parse(td.decode(pt))});
}

/* ================= data access ================= */
function N(k,def){return S.nodes[k]!==undefined?S.nodes[k]:def}
function meta(){return N('doc-meta',{})}
function list(k){var n=N(k,null);return n&&Array.isArray(n.list)?n.list:[]}
function sections(){
  var order=list('order'),out=[],seen={};
  order.forEach(function(id){var s=S.nodes['sec_'+id];if(s&&!seen[id]){out.push(s);seen[id]=1}});
  Object.keys(S.nodes).forEach(function(k){if(k.indexOf('sec_')===0){var s=S.nodes[k];if(s&&!seen[s.id]){out.push(s);seen[s.id]=1}}});
  return out;
}
function secById(id){return S.nodes['sec_'+id]||null}
function accounts(){return Object.keys(S.nodes).filter(function(k){return k.indexOf('acc_')===0}).map(function(k){return S.nodes[k]}).sort(function(a,b){return (a.ord||0)-(b.ord||0)})}
function findAcc(id){return S.nodes['acc_'+id]||null}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function put(k,obj){
  S.nodes[k]=obj;S.pending++;updateBar();
  return encWith(S.key,obj).then(function(blob){
    S.ivs[k]=blob.iv;
    return roomRef('nodes/'+k).set(blob);
  }).then(function(){S.pending--;updateBar()},function(e){S.pending--;updateBar();writeFail(e)});
}
function del(k){
  delete S.nodes[k];delete S.ivs[k];S.pending++;updateBar();
  return roomRef('nodes/'+k).remove().then(function(){S.pending--;updateBar()},function(e){S.pending--;updateBar();writeFail(e)});
}
function writeFail(e){
  console.error(e);
  var code=(e&&(e.code||e.message)||'')+'';
  if(/permission/i.test(code))toast('저장 권한이 없습니다. Firebase 보안규칙에 handover 경로를 추가해 주세요.');
  else toast('저장하지 못했습니다. 인터넷 연결을 확인해 주세요.');
}

/* ================= unlock / create ================= */
function tryUnlock(pass){
  if(!initFirebase()){S.err='Firebase에 연결할 수 없습니다. 설정을 확인해 주세요.';render();return}
  S.busy=true;S.err='';render();
  var room;
  roomIdOf(pass).then(function(r){room=r;return authReady}).then(function(){
    S.room=room;
    return roomRef('meta').once('value');
  }).then(function(snap){
    var m=snap.val();
    if(!m){S.pass=pass;S.phase='create';S.busy=false;S.err='';render();return}
    return aesKey(pass,fromB64(m.salt),m.iter).then(function(key){
      return decWith(key,m.check).then(function(v){
        if(v!=='lifemeal-handover-ok')throw new Error('check');
        S.key=key;S.salt=fromB64(m.salt);S.pass=null;S.phase='loading';S.busy=false;render();
        subscribe();rememberDevice();
      });
    }).catch(function(){S.busy=false;S.room=null;S.err='비밀번호가 맞지 않습니다.';render()});
  }).catch(function(e){
    console.error(e);S.busy=false;S.room=null;
    S.err=/permission/i.test(String(e&&(e.code||e.message)))?'읽기 권한이 없습니다. Firebase 보안규칙을 확인해 주세요.':'연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    render();
  });
}
function createDoc(seed){
  S.busy=true;S.err='';render();
  var salt=crypto.getRandomValues(new Uint8Array(16)),key;
  aesKey(S.pass,salt,ITER).then(function(k){key=k;return encWith(key,'lifemeal-handover-ok')}).then(function(check){
    var plain=seedToNodes(seed),keys=Object.keys(plain);
    return Promise.all(keys.map(function(k){return encWith(key,plain[k])})).then(function(blobs){
      var up={};
      up['meta']={v:1,salt:toB64(salt),iter:ITER,check:check,createdAt:Date.now()};
      keys.forEach(function(k,i){up['nodes/'+k]=blobs[i]});
      return roomRef().update(up);
    });
  }).then(function(){
    S.key=key;S.salt=salt;S.pass=null;S.phase='loading';S.busy=false;render();subscribe();rememberDevice();
    toast('인수인계 문서를 만들었습니다.');
  }).catch(function(e){
    console.error(e);S.busy=false;
    S.err=/permission/i.test(String(e&&(e.code||e.message)))?'쓰기 권한이 없습니다. Firebase 보안규칙에 handover 경로를 추가해 주세요.':'만들지 못했습니다. 잠시 후 다시 시도해 주세요.';
    render();
  });
}
function seedToNodes(seed){
  seed=seed||{};
  var out={};
  out['doc-meta']=Object.assign({title:'라이프밀 인수인계',basis:'',author:'',successor:'',handoverDate:''},seed.meta||{});
  out['facts']={list:seed.facts||[]};
  out['tasks']={list:(seed.tasks||[]).map(function(t){return Object.assign({id:uid('t')},t)})};
  out['links']={list:seed.links||[]};
  var order=[];
  (seed.sections||[]).forEach(function(s){var id=s.id||uid('s');order.push(id);out['sec_'+id]={id:id,title:s.title||'파트',lede:s.lede||'',groups:(s.groups||[]).map(function(g){return {h:g.h||'',d:g.d||'',items:g.items||[]}})};if(s.group)out['sec_'+id].group=s.group;if(s.pin)out['sec_'+id].pin=true});
  out['order']={list:order};
  (seed.accounts||[]).forEach(function(a,i){var id=a.id||uid('a');out['acc_'+id]=Object.assign({cat:'',name:'',url:'',login:'',pw:'',mfa:'',owner:'',changed:'',note:'',status:'todo'},a,{id:id,ord:a.ord!=null?a.ord:i})});
  return out;
}
function subscribe(){
  nodesRef=roomRef('nodes');
  nodesRef.on('value',function(snap){

var IDB_NAME='lm-handover',IDB_STORE='k',IDB_KEY=ROOT;

function mergeData(src){
  var nodes=seedToNodes(src),puts=[];
  if(src.accounts)src.accounts.forEach(function(a){
    var k='acc_'+a.id,cur=S.nodes[k];
    if(!cur){puts.push(['acc_'+a.id,nodes[k]]);return}
    var out=Object.assign({},cur);
    Object.keys(a).forEach(function(f){var v=a[f];if(v!==''&&v!=null&&f!=='ord'&&f!=='id')out[f]=v});
    puts.push([k,out]);
  });
  if(src.tasks){
    var ts=list('tasks').slice();
    nodes['tasks'].list.forEach(function(t){if(!ts.some(function(x){return x.text===t.text}))ts.push(t)});
    puts.push(['tasks',{list:ts}]);
  }
  if(src.sections){
    Object.keys(nodes).forEach(function(k){if(k.indexOf('sec_')===0)puts.push([k,nodes[k]])});

  }
  if(src.facts&&src.facts.length)puts.push(['facts',nodes['facts']]);
